[platformio]
default_envs = cardputer
; Working on IP9Kit together with the app: copy ip9kit-local.ini.example to ip9kit-local.ini
; (git-ignored), which builds against the IP9Kit checkout next to this folder.
extra_configs = ip9kit-local*.ini

[ip9kit]
; Shared core of the IP9 Cardputer apps, pinned to a release tag.
source = https://github.com/raptyk/IP9Kit.git#v1.0.0

[env]
platform = espressif32@6.9.0
framework = arduino
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = default_8MB.csv
upload_speed = 1500000
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -DESP32S3
    ; TinyUSB (OTG) mode so the Cardputer can act as a USB keyboard/mouse for the TV.
    ; USB is started only in the USB link mode; logging stays off because UART0 shares
    ; GPIO43/44 with the speaker clock and the IR LED.
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
    -DAPP_VERSION=\"1.6.0\"
extra_scripts = post:scripts/make_release.py
; M5Launcher shows the first letters of the file name, so every IP9 app starts with "IP9".
custom_release_name = IP9LGRemote
build_unflags =
    -std=gnu++11
    -DARDUINO_USB_MODE=1
; Optional ListItem fields are left out of brace initializers on purpose.
build_src_flags = -std=gnu++17 -Wall -Wextra -Wno-missing-field-initializers
lib_deps =
    m5stack/M5Cardputer
    ${ip9kit.source}
    z3t0/IRremote@^4.4.1
    links2004/WebSockets@^2.6.1
    bblanchon/ArduinoJson@^7.2.1
    h2zero/NimBLE-Arduino@^2.1.2

[env:cardputer]
